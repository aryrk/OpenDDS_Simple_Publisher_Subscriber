[common]
DCPSDebugLevel=0
DCPSDefaultDiscovery=DEFAULT_RTPS
DCPSGlobalTransportConfig=config1

# These settings are crucial for monitor
DCPSTypeLookupService=1
DCPSBit=1
DCPSUseXtypes=1

# This setting will help with monitoring
DCPSPendingTimeout=3

[domain/0]
DiscoveryConfig=DEFAULT_RTPS
DefaultTransportConfig=config1

[rtps_discovery/DEFAULT_RTPS]
SedpMulticast=239.255.0.1:7400
DefaultMulticastGroup=239.255.0.1:7400
ResendPeriod=5
TTL=1
TypeLookupService=1

# Configure both UDP and TCP transport
[config/config1]
transports=udp1,tcp1

[transport/udp1]
transport_type=udp
local_address=0.0.0.0

# Add TCP transport for more reliable monitor connections
[transport/tcp1]
transport_type=tcp
local_address=0.0.0.0